
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b08">
  <title>Navpoint Terminal</title>
  <link rel="stylesheet" href="terminal.css">
</head>
<body>
  <main id="terminal" class="terminal">

    <header class="terminal-header">
      <div class="terminal-brand">
        <span class="status-dot"></span>
        <span>NAVPOINT</span>
      </div>

      <div class="terminal-controls">
        <button id="minimize-terminal" aria-label="Minimizar">−</button>
        <button id="close-terminal" aria-label="Fechar">×</button>
      </div>
    </header>

    <section id="terminal-output" class="terminal-output" aria-live="polite">
      <p class="system-message">NAVPOINT SYSTEM [versão 1.0]</p>
      <p>Terminal de navegação iniciado.</p>
      <p>Digite <span class="command-highlight">help</span> para consultar os comandos.</p>
    </section>

    <section id="shortcut-panel" class="shortcut-panel" hidden>
      <div class="shortcut-heading">
        <span class="status-dot"></span>
        <h2>NOVO ATALHO</h2>
      </div>

      <form id="shortcut-form" class="shortcut-form">
        <label for="shortcut-name">Qual será o nome do atalho?</label>
        <input
          id="shortcut-name"
          type="text"
          placeholder="Ex.: YT, GPT, WIKI..."
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="30"
          required
        >

        <label for="shortcut-url">Para onde o atalho deve levar?</label>
        <input
          id="shortcut-url"
          type="text"
          placeholder="Ex.: https://youtube.com"
          autocomplete="url"
          autocapitalize="off"
          spellcheck="false"
          required
        >

        <p id="shortcut-feedback" class="shortcut-feedback" aria-live="polite"></p>

        <div class="shortcut-actions">
          <button
            id="cancel-shortcut"
            class="cancel-shortcut"
            type="button"
            aria-label="Voltar ao terminal"
            title="Voltar ao terminal"
          >×</button>

          <button class="confirm-shortcut" type="submit">
            Confirmar
          </button>
        </div>
      </form>
    </section>

    <form id="terminal-form" class="terminal-input-area">
      <span class="prompt">&gt;</span>
      <input
        id="terminal-input"
        type="text"
        placeholder="Digite um comando..."
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >
    </form>

    <footer class="terminal-footer">
      <span>NAVPOINT</span>
      <span>READY</span>
    </footer>

    <div
      id="resize-handle"
      class="resize-handle"
      role="button"
      aria-label="Redimensionar terminal"
      title="Arraste para redimensionar"
    ></div>

  </main>

  <script src="terminal.js"></script>
</body>
</html>
