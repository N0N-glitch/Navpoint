<!DOCTYPE html>
<html lang="pt" class="entering">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Navpoint</title>
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <main class="screen">
    <header class="top">
      <span class="brand">NAVPOINT</span>
      <span class="step" id="step-label">1/4</span>
    </header>

    <h1 id="title"></h1>
    <p id="subtitle" class="subtitle"></p>

    <!-- Etapa 1: idioma -->
    <section id="step-language" class="step-body">
      <div class="language-area">
        <div class="selected-side" aria-live="polite">
          <span id="selected-caption" class="selected-caption"></span>
          <span class="selected-line">
            <span class="prompt" aria-hidden="true">&gt;</span>
            <strong id="selected-name" class="selected-name"></strong>
            <span class="cursor" aria-hidden="true">_</span>
          </span>
        </div>

        <div
          id="language-options"
          class="options-side"
          role="radiogroup"
          aria-labelledby="title"
        ></div>
      </div>

      <p id="status" class="status" role="status"></p>

      <footer class="bottom">
        <button id="confirm-button" class="confirm" type="button"></button>
      </footer>
    </section>

    <!-- Etapa 2: apresentação e tutorial -->
    <section id="step-tour" class="step-body" hidden>
      <div id="tour-body" class="tour-body"></div>

      <p id="dots" class="dots" role="img"></p>

      <footer class="tour-bottom">
        <div class="tour-nav">
          <button id="back-button" class="ghost" type="button"></button>
          <button id="next-button" class="confirm" type="button"></button>
        </div>

        <div class="skip-row">
          <button id="skip-button" class="skip" type="button"></button>
        </div>
      </footer>
    </section>

    <!-- Etapa 3: ainda em desenvolvimento -->
    <section id="step-next" class="step-body" hidden>
      <p id="next-text" class="tour-text"></p>
    </section>
  </main>

  <script src="../shared/matrix-rain.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
